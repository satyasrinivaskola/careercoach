<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - CareerCoach</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="login-container">

        <h1>CareerCoach</h1>

        <h2>Login</h2>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p id="message"></p>


        <p>
            Don't have an account?
            <a href="/Register.html">
                Register
            </a>
        </p>


        <p>
            <a href="/">
                Back to Home
            </a>
        </p>

    </div>


    <script src="login.js"></script>

</body>

</html>
