<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Register</title>

</head>


<body>

    <h2> Registration</h2>


    <form id="registerForm">

        <label>Full Name:</label>
        <br>

        <input
            type="text"
            id="name"
            required
        >

        <br><br>


        <label>Email Address:</label>
        <br>

        <input
            type="email"
            id="email"
            required
        >

        <br><br>


        <label>Password:</label>
        <br>

        <input
            type="password"
            id="password"
            required
        >

        <br><br>


      


        <button type="submit">
            Submit Registration
        </button>

    </form>


    <p id="responseMsg"></p>


    <script src="Register.js"></script>

</body>

</html>
